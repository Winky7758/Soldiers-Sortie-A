<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>士兵突击 · 模拟器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:#11150c;
  color:#d8dcc8;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.8;
  padding:10px 10px 60px;
  max-width:620px;margin:0 auto;
}
.card{
  background:#1a2114;
  border:1px solid #384a24;
  border-radius:10px;
  padding:12px 12px;
  margin-bottom:12px;
}
.title{
  color:#a8c46a;font-weight:bold;
  border-left:3px solid #7a9a3a;
  padding-left:8px;margin-bottom:10px;
  font-size:15px;letter-spacing:1px;
}
pre.code{
  background:#0d1108;
  border:1px solid #2c3a1c;
  border-radius:8px;
  padding:10px 8px;
  font-family:"SF Mono",Consolas,"Courier New",monospace;
  font-size:11.5px;line-height:1.65;
  overflow-x:auto;
  color:#b9d189;
  white-space:pre;
  -webkit-overflow-scrolling:touch;
}
.story{
  font-style:italic;
  color:#e2e6d2;
  letter-spacing:.3px;
}
.story p{margin-bottom:10px;font-style:italic}
.btn{
  display:block;width:100%;
  background:#25301a;
  color:#c8dc9a;
  border:1px solid #4d6630;
  border-radius:8px;
  padding:11px 12px;
  font-size:14.5px;
  font-family:inherit;
  text-align:left;
  margin-top:9px;
  cursor:pointer;
  transition:.15s;
  line-height:1.55;
}
.btn:active{background:#38471f;transform:scale(.985)}
.btn:disabled{opacity:.35}
.btn.custom{background:#1d2515;border-style:dashed;color:#9fb073}
.input{
  width:100%;
  background:#0d1108;
  border:1px solid #3a4a24;
  border-radius:8px;
  color:#c8dc9a;
  padding:11px;
  font-size:15px;
  font-family:inherit;
  margin-bottom:10px;
}
.input:focus{outline:none;border-color:#7a9a3a}
.alloc-row{
  display:flex;align-items:center;
  gap:8px;margin-bottom:8px;
}
.alloc-name{width:52px;color:#a8c46a;font-size:14px}
.alloc-bar{flex:1;color:#7fa03f;font-family:monospace;font-size:12px;letter-spacing:-1px}
.alloc-val{width:34px;text-align:right;color:#e0e8c8;font-size:13px}
.mini{
  width:32px;height:32px;
  background:#25301a;border:1px solid #4d6630;
  color:#c8dc9a;border-radius:6px;
  font-size:17px;line-height:1;
  cursor:pointer;
}
.mini:active{background:#38471f}
.tag{color:#7fa03f;font-size:13px}
.hint{color:#7f8a68;font-size:12.5px;margin-top:8px;line-height:1.6}
hr{border:none;border-top:1px dashed #33421f;margin:10px 0}
</style>
</head>
<body>
<div id="screen"></div>

<script>
/* ============================================================
   全局状态
============================================================ */
let G = null;
let creation = {
  step: 0,
  data: {
    name:'', age:19, origin:'', past:'', trait:'',
    attrs:{体能:20,射击:20,战术:20,意志:20,人缘:20,悟性:20},
    left:30
  }
};

/* ============================================================
   工具函数
============================================================ */
function bar(v, max){
  max = max || 100;
  const n = Math.max(0, Math.min(10, Math.round(v/max*10)));
  return '■'.repeat(n) + '□'.repeat(10-n);
}
function num(v){ return String(Math.round(v)).padStart(3,' '); }

/* ============================================================
   角色创建
============================================================ */
function renderCreation(){
  const s = document.getElementById('screen');
  const d = creation.data;
  let html = '';

  switch(creation.step){
    case 0:
      html = `
      <div class="card">
        <div class="title">🎖️ 士兵突击 · 模拟器</div>
        <p>一九九九年冬，北方某集团军新兵连。</p>
        <p>风很硬，操场是土的，脸是生的。</p>
        <p style="margin-top:10px;color:#a8c46a">你什么都还不是。</p>
        <p style="color:#a8c46a">先报上名来。</p>
      </div>
      <div class="card">
        <div class="title">【 1 / 6 】姓名</div>
        <input id="nameInput" class="input" placeholder="请输入你的名字（2-4字）" maxlength="4">
        <button class="btn" onclick="setName()">▶ 确认</button>
      </div>`;
      break;

    case 1:
      html = `
      <div class="card">
        <div class="title">【 2 / 6 】年龄</div>
        <p class="hint">你入伍时的年龄。太年轻容易被人看轻，太年长又难融进新兵堆里。</p>
        <button class="btn" onclick="setAge(18)">▶ 十八岁 · 刚够入伍线，什么都还来得及</button>
        <button class="btn" onclick="setAge(19)">▶ 十九岁 · 不高不低，最常见的那一档</button>
        <button class="btn" onclick="setAge(20)">▶ 二十岁 · 比同批人大一截，得靠自己站稳</button>
        <button class="btn" onclick="setAge(22)">▶ 二十二岁 · 在家干过几年活，手上有茧</button>
      </div>`;
      break;

    case 2:
      html = `
      <div class="card">
        <div class="title">【 3 / 6 】来处</div>
        <p class="hint">你从哪儿来，会在你身上留下痕迹。</p>
        <button class="btn" onclick="setOrigin('农村')">▶ 农村 · 地里的活干惯了，力气有，见识少 💪</button>
        <button class="btn" onclick="setOrigin('县城')">▶ 县城 · 念过几年书，脑子活，身子骨一般 💡</button>
        <button class="btn" onclick="setOrigin('城市')">▶ 城市 · 见识多，嘴皮子利索，体能是短板 🤝</button>
        <button class="btn" onclick="setOrigin('军人家庭')">▶ 军人家庭 · 从小听军号长大，规矩刻在骨子里 🎖️</button>
      </div>`;
      break;

    case 3:
      html = `
      <div class="card">
        <div class="title">【 4 / 6 】入伍前</div>
        <p class="hint">你带着什么进了军营。</p>
        <button class="btn" onclick="setPast('读书')">▶ 高中毕业，成绩不好不坏，考学没考上 📖</button>
        <button class="btn" onclick="setPast('打工')">▶ 在工地干过，在饭馆端过盘子，什么都试过 🔨</button>
        <button class="btn" onclick="setPast('待业')">▶ 在家闲着，被家里人推着来的 🛏️</button>
        <button class="btn" onclick="setPast('体校')">▶ 体校练过几年，跑得快，跳得高 🏃</button>
      </div>`;
      break;

    case 4:
      html = `
      <div class="card">
        <div class="title">【 5 / 6 】性子</div>
        <p class="hint">没人知道这性子会把你带到哪儿去。</p>
        <button class="btn" onclick="setTrait('闷')">▶ 话少 · 别人说十句你说一句，心里有本账 🤐</button>
        <button class="btn" onclick="setTrait('轴')">▶ 轴 · 认准的事，撞了墙也不回头 🔥</button>
        <button class="btn" onclick="setTrait('灵')">▶ 机灵 · 眼观六路，知道什么时候该说什么话 💡</button>
        <button class="btn" onclick="setTrait('憨')">▶ 憨厚 · 别人算计你不计较，吃亏也认 🤝</button>
      </div>`;
      break;

    case 5:
      html = `
      <div class="card">
        <div class="title">【 6 / 6 】分配点数 · 剩余 <span style="color:#ffd166">${d.left}</span></div>
        <p class="hint">你有一些底子，但怎么用它，是你自己的事。</p>
        ${Object.keys(d.attrs).map(k=>`
          <div class="alloc-row">
            <span class="alloc-name">${k}</span>
            <span class="alloc-bar">${bar(d.attrs[k],60)}</span>
            <span class="alloc-val">${d.attrs[k]}</span>
            <button class="mini" onclick="adj('${k}',-1)">−</button>
            <button class="mini" onclick="adj('${k}',1)">+</button>
          </div>`).join('')}
        <hr>
        <div class="hint">
          体能 💪 跑步、单杠、负重<br>
          射击 🎯 据枪、击发、心理<br>
          战术 🧠 队形、判断、协同<br>
          意志 🔥 扛住、不崩、坚持<br>
          人缘 🤝 被人记住、被人接纳<br>
          悟性 💡 学得快、想得深
        </div>
        <button class="btn" ${d.left>0?'disabled':''} onclick="startGame()">
          ▶ ${d.left>0?'还剩 '+d.left+' 点未分配':'完成，进入军营'}
        </button>
      </div>`;
      break;
  }
  s.innerHTML = html;
  if(creation.step === 0){
    const inp = document.getElementById('nameInput');
    if(inp) inp.focus();
  }
}

function setName(){
  const v = document.getElementById('nameInput').value.trim();
  if(!v){ alert('总得有个名字。'); return; }
  creation.data.name = v;
  creation.step = 1; renderCreation();
}
function setAge(a){
  creation.data.age = a;
  if(a>=21){ creation.data.attrs.意志 += 8; creation.data.attrs.体能 += 5; }
  if(a<=18){ creation.data.attrs.悟性 += 6; creation.data.attrs.体能 += 3; }
  creation.step = 2; renderCreation();
}
function setOrigin(o){
  const a = creation.data.attrs;
  if(o==='农村'){ a.体能+=10; a.意志+=6; a.悟性-=4; }
  if(o==='县城'){ a.悟性+=8; a.战术+=5; a.体能-=3; }
  if(o==='城市'){ a.人缘+=10; a.悟性+=5; a.体能-=6; }
  if(o==='军人家庭'){ a.战术+=10; a.意志+=5; a.人缘-=4; }
  creation.data.origin = o;
  creation.step = 3; renderCreation();
}
function setPast(p){
  const a = creation.data.attrs;
  if(p==='读书'){ a.悟性+=8; a.战术+=4; }
  if(p==='打工'){ a.人缘+=6; a.意志+=6; }
  if(p==='待业'){ a.意志-=4; a.人缘+=4; a.悟性+=3; }
  if(p==='体校'){ a.体能+=12; a.射击-=3; }
  creation.data.past = p;
  creation.step = 4; renderCreation();
}
function setTrait(t){
  const a = creation.data.attrs;
  if(t==='闷'){ a.意志+=8; a.人缘-=4; }
  if(t==='轴'){ a.意志+=10; a.人缘-=3; a.悟性-=2; }
  if(t==='灵'){ a.人缘+=8; a.悟性+=6; a.意志-=3; }
  if(t==='憨'){ a.人缘+=10; a.意志+=4; a.悟性-=3; }
  creation.data.trait = t;
  creation.step = 5; renderCreation();
}
function adj(k,d){
  const a = creation.data.attrs;
  if(d>0 && creation.data.left<=0) return;
  if(d<0 && a[k]<=20) return;
  a[k] += d;
  creation.data.left -= d;
  renderCreation();
}

/* ============================================================
   开局
============================================================ */
function startGame(){
  const d = creation.data;
  G = {
    name: d.name,
    age: d.age,
    origin: d.origin,
    past: d.past,
    trait: d.trait,
    attrs: Object.assign({}, d.attrs),
    st: {体力:100, 精神:100, 士气:55},
    rel: {许三多:0,成才:0,史今:0,伍六一:0,高城:0,袁朗:0,吴哲:0,齐桓:0,老马:0},
    met: new Set(['史今']),
    flags: {},
    scene: 'newbie_arrive',
    turn: 0
  };
  render();
}

/* ============================================================
   效果应用
============================================================ */
function applyEffects(e){
  if(!e) return;
  if(e.attrs) for(const k in e.attrs){
    G.attrs[k] = Math.max(0, Math.min(100, G.attrs[k] + e.attrs[k]));
  }
  if(e.rel) for(const k in e.rel){
    G.rel[k] = Math.max(-100, Math.min(100, G.rel[k] + e.rel[k]));
    G.met.add(k);
  }
  if(e.st) for(const k in e.st){
    G.st[k] = Math.max(0, Math.min(100, G.st[k] + e.st[k]));
  }
  if(e.flags) for(const k in e.flags) G.flags[k] = e.flags[k];
  if(e.met) e.met.forEach(m=>G.met.add(m));
}

/* ============================================================
   场景数据
============================================================ */
const scenes = {

/* ---------- 新兵连 ---------- */

    `车一停，外面有人敲车厢板，喊"下车下车"。你抓起背包，带子缠在腿上，踉跄了一下，撞到旁边的人。那人没吭声，只是扶了你一把。他脸黑，眼睛亮。`,

    { t:'按部就班，先把背包带子理好，再站进队',

    { t:'走过去，帮许三多把塌下去的背包扶正',

qilian_arrive: {
  date:'二〇〇〇年三月十六日', time:'清晨', weather:'晴', place:'钢七连 · 营区',
  text: [
    `钢七连的早晨从五点开始。`,
    `你被哨声叫醒的时候，天还是黑的。十分钟后你已经站在操场上，呼出的白气在面前散开。五公里，风雨无阻，这是钢七连的规矩。`,
    `跑完回来，你才看清这座营房。门口有一面墙，墙上密密麻麻刻着名字，从上到下，一行一行。老兵说，那是钢七连的兵。每一个进连的人，都要在这里找到自己的位置。`,
    `许三多也来了。史今力争把他要过来的。高城连长在连部门口看了他一眼，那一眼很短，但许三多整个人缩了一下。`,

  choices: [

  text: [
    `钢七连的日子是熬出来的。`,
    `每天的加练你从没落下。操场上，单杠被晒得烫手，掌心的茧磨破又长出来。伍六一总是第一个到，最后一个走。他不跟你说话，但每次你多做一组，他就多做两组。`,
    `许三多还在拖后腿。全班成绩被他往下拽，有人开始当面骂他。史今护着他，但史今自己也很累——你看见过他一个人坐在连部门口的台阶上抽烟，烟烧到手指才反应过来。`,
    `成才越来越顺。他在训练场上是标杆，在班里也吃得开。他跟谁都笑，跟谁都好，但你总觉得那笑是有分寸的——像是量好了尺寸才递出来的。`,

    `你没回答。他自己接下去："图个好前程呗。"`,

qilian_333: {
  date:'二〇〇〇年八月', time:'下午', weather:'烈日', place:'钢七连 · 单杠场',
  text: [
    `那天全连都在场。`,
    `本来是正常的体能考核，许三多被点名做腹部绕杠。他爬上单杠，手一勾，身子吊在那儿，晃。`,
    `一圈。两圈。三圈。到第八圈的时候，他的动作已经变形了。底下有人开始数，声音越来越大。`,
    `"二十！""三十！"`,
    `许三多的脸涨成了紫红色，手上全是汗。他的身体已经不听使唤了，但他在转，一圈，又一圈。`,
    `史今站在单杠下面，仰着头，一句话不说。高城不知道什么时候来了，站在人群外面，抱着胳膊。`,
    `数字还在往上走。有人笑，笑着笑着不笑了。因为所有人都看出来了——他不是在完成考核，他是在跟自己死磕。`,
    `"三百三十三！"`,
    `许三多从单杠上掉下来，摔在沙坑里，趴着起不来。全场安静了两秒。`,
    `然后不知道谁先鼓的掌。掌声稀稀拉拉响起来，最后连成一片。`,
    `高城什么也没说，转身走了。但你知道，从今天开始，许三多这个人，在他心里有位置了。`
  ],
  choices: [

wuban_arrive: {
  date:'二〇〇〇年三月十六日', time:'中午', weather:'晴，大风', place:'草原五班 · 驻训点',
  text: [
    `越野车开了四个钟头，把你扔在一片空地上。`,
    `司机指了指前面那排低矮的平房，说"到了"，然后掉头就走。车屁股后面的尘土扬起来，半天没落。`,
    `这里什么都没有。天很大，地很平，风从很远的地方吹过来，中间没有任何东西挡着。你能听见风穿过电线杆的声音，呜呜的，像有人在哭。`,
    `门口台阶上躺着一个人，帽檐盖着脸。你走近了，他才把帽子往上推了推，露出一双没什么神采的眼睛。`,

    `你把行李放下。床板上有一层灰。`,

wuban_road: {

  text: [
    `你来五班两个月了。`,
    `两个月里你干了很多事，也什么都没干。你擦过枪，虽然这里没几支枪；你跑过步，虽然没人给你计时；你把五班的院子扫了一遍又一遍，扫到最后，老马说："你是不是有病？"`,
    `然后你想修一条路。`,
    `从营房到那条输油管道的巡检道，中间有三百多米。下雨天全是泥，人走一趟裤腿上能挂二斤土。`,
    `你捡了石头，一块一块地铺。第一天，老马在门口看着你，看了一会儿，回屋了。第二天，他出来说："别折腾了，没人看。"`,

    `"这石头不行，"他说，"得用那边那种青的。"`,
    `风从草原上刮过来，把尘土吹得老远。你的手磨破了，掌心是血泡，但你没停。`

    `那天全连集合，站在营房前面。门口的杨树掉了一地叶子，踩上去沙沙响。`,
    `高城站在最前面，站了很久。他张了几次嘴，都没说出话。`,

    `没有人说话。风把落叶卷起来，打了个旋。`,

    `唱到最后一句"踏敌尸骨唱凯旋"，声音大得像是要把营房震塌。`,
    `唱完了，队伍解散。有人蹲在地上不起来。`,

/* ============================================================
   渲染
============================================================ */
function render(){
  if(!G){ renderCreation(); return; }
  const s = scenes[G.scene];
  const scr = document.getElementById('screen');

  /* 顶部面板 */
  let html = '';

  html += `<div class="card">
    <div class="title">🎖️ 士兵档案</div>
    <pre class="code"># ════ 702团 · 士兵档案 ════
姓名：${G.name}　年龄：${G.age}岁
日期：${s.date}
时段：${s.time}
天气：${s.weather}
地点：${s.place}
来历：${G.origin}｜${G.past}｜${G.trait}</pre>
  </div>`;

  /* 核心属性 */
  html += `<div class="card">
    <div class="title">📊 核心属性</div>
    <pre class="code"># ════ 能力面板 ════
体能 💪 ${bar(G.attrs.体能)} ${num(G.attrs.体能)}
射击 🎯 ${bar(G.attrs.射击)} ${num(G.attrs.射击)}
战术 🧠 ${bar(G.attrs.战术)} ${num(G.attrs.战术)}
意志 🔥 ${bar(G.attrs.意志)} ${num(G.attrs.意志)}
人缘 🤝 ${bar(G.attrs.人缘)} ${num(G.attrs.人缘)}
悟性 💡 ${bar(G.attrs.悟性)} ${num(G.attrs.悟性)}

# ════ 当前状态 ════
体力 ⚡ ${bar(G.st.体力)} ${num(G.st.体力)}
精神 🌙 ${bar(G.st.精神)} ${num(G.st.精神)}
士气 🎗️ ${bar(G.st.士气)} ${num(G.st.士气)}</pre>
  </div>`;

  /* 指令大全 */
  html += `<div class="card">
    <div class="title">📜 指令大全</div>
    <pre class="code"># ══════ 指令大全 ══════
【📋 基础类】
  查看状态｜查看关系｜存档｜读档
【🏃 行动类】
  加练｜休息｜独处｜自由活动
  出操｜训练｜站岗｜整内务
【💬 社交类】
  找史今｜找许三多｜找成才
  找伍六一｜找高城｜找袁朗
  找吴哲｜找齐桓｜找老马
【👁️ 观察类】
  看训练场｜看班务会｜看连部
  看操场｜看营房｜看窗外
【🎖️ 军务类】
  参加演习｜执行任务｜写家信
  擦拭武器｜整理军装
【⚙️ 系统类】
  重开人生｜返回主界面</pre>
  </div>`;

  /* 剧情 */
  html += `<div class="card">
    <div class="title">📖 第 ${G.turn + 1} 回合</div>
    <div class="story">${s.text.map(p=>`<p>${p}</p>`).join('')}</div>
  </div>`;

  /* 关系树 */
  html += renderRelationTree();

  /* 选项 */
  html += `<div class="card">
    <div class="title">🎯 你打算怎么做</div>`;
  s.choices.forEach((c, i) => {
    const letter = 'ABCD'[i] || '·';
    html += `<button class="btn" onclick="choose(${i})">【${letter}】${c.t}</button>`;
  });
  html += `<button class="btn custom" onclick="customChoice()">【✎ 自定义】自己写一个行动</button>`;
  html += `</div>`;

  scr.innerHTML = html;
  window.scrollTo(0,0);
}

function renderRelationTree(){
  const R = G.rel;
  const met = G.met;
  function line(name, emoji){
    if(!met.has(name)) return '';
    const v = R[name] || 0;
    let tag = '陌生';
    if(v >= 60) tag = '生死之交';
    else if(v >= 40) tag = '信得过';
    else if(v >= 20) tag = '有交情';
    else if(v >= 5) tag = '认得你';
    else if(v <= -20) tag = '看不上你';
    else if(v <= -5) tag = '有点意见';
    return `  ${emoji} ${name.padEnd(4,'　')} ${bar(v+50,100)} ${tag}\n`;
  }
  let t = '# ════ 人物关系树 ════\n\n【702团】\n';
  t += '  高城（连长）\n';
  t += '   └─ 史今（班长）\n';
  t += '       ├─ 许三多\n';
  t += '       ├─ 成才\n';
  t += '       ├─ 伍六一\n';
  t += `       └─ ${G.name} ★\n\n`;
  t += '【草原五班】\n  老马（班长）\n\n';
  t += '【A大队】\n  袁朗（中队长）\n';
  t += '   ├─ 齐桓（菜刀）\n';
  t += '   └─ 吴哲（少校）\n\n';
  t += '# ════ 好感度 ════\n';
  let body = '';
  body += line('史今','🧑‍✈️');
  body += line('许三多','🙂');
  body += line('成才','😏');
  body += line('伍六一','🗿');
  body += line('高城','🎖️');
  body += line('老马','🚬');
  body += line('袁朗','😐');
  body += line('吴哲','📚');
  body += line('齐桓','🔪');
  if(!body) body = '  （还没有认识什么人）\n';
  return `<div class="card">
    <div class="title">🌳 人物关系</div>
    <pre class="code">${t}${body}</pre>
  </div>`;
}

/* ============================================================
   选择处理
============================================================ */
function choose(i){
  const s = scenes[G.scene];
  const c = s.choices[i];
  if(!c) return;
  applyEffects(c.e);
  G.turn++;
  let next = c.n;
  if(c.nFn) next = c.nFn();
  if(!next){ return; }
  G.scene = next;
  render();
}

function customChoice(){
  const s = scenes[G.scene];
  const txt = prompt('写下你要做的事（一句话）：');
  if(txt === null) return;
  const t = txt.trim();
  if(!t) return;

  /* 关键词判定 */
  const e = {};
  if(/跑|练|加练|单杠|体能|负重|五公里/.test(t)){
    e.attrs = {体能:5, 意志:3};
    e.st = {体力:-12};
  } else if(/枪|射击|打靶|瞄准/.test(t)){
    e.attrs = {射击:5};
    e.st = {体力:-6};
  } else if(/聊|说|问|找|谈/.test(t)){
    e.attrs = {人缘:4, 悟性:2};
    e.st = {精神:6};
    const names = ['史今','许三多','成才','伍六一','高城','袁朗','吴哲','齐桓','老马'];
    for(const n of names){
      if(t.includes(n)){
        e.rel = {}; e.rel[n] = 8; e.met = [n];
        break;
      }
    }
  } else if(/看|观察|想|琢磨|研究/.test(t)){
    e.attrs = {悟性:4, 战术:3};
    e.st = {精神:4};
  } else if(/睡|休息|歇|躺/.test(t)){
    e.st = {体力:10, 精神:8};
  } else if(/写信|家信|独处|坐着/.test(t)){
    e.attrs = {意志:3};
    e.st = {精神:10};
  } else {
    e.attrs = {意志:2};
    e.st = {精神:3};
  }

  applyEffects(e);
  G.turn++;
  const next = s.customNext || 'ending';
  alert('你做了你想做的事。');
  G.scene = next;
  render();
}

/* ============================================================
   启动
============================================================ */
renderCreation();
</script>
</body>
